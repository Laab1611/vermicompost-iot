global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files: []

scrape_configs:
  - job_name: telemetry-ingestion-service
    static_configs:
      - targets: ['telemetry-ingestion-service:8000']
    metrics_path: /metrics

  - job_name: query-monitoring-service
    static_configs:
      - targets: ['query-monitoring-service:8000']
    metrics_path: /metrics

  - job_name: digital-twin-integration-service
    static_configs:
      - targets: ['digital-twin-integration-service:8000']
    metrics_path: /metrics

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']