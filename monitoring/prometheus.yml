global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: telemetry-ingestion-service
    static_configs:
      - targets: ['telemetry-ingestion-service:8000']
    metrics_path: /metrics

  - job_name: query-monitoring-service
    static_configs:
      - targets: ['query-monitoring-service:8000']
    metrics_path: /metrics

  - job_name: digital-twin-integration-service
    static_configs:
      - targets: ['digital-twin-integration-service:8000']
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics
