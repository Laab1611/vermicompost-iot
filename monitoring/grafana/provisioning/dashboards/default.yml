      path: /var/lib/grafana/dashboards/backend
      foldersFromFilesStructure: false

  - name: "Dominio"
    orgId: 1
    folder: "Dominio"
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/dominio
      foldersFromFilesStructure: false
