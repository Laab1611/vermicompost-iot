services:

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana-enterprise
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_METRICS_ENABLED: "true"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    networks:
      - vermicompost-net
    healthcheck:
      start_period: 30s
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  telemetry-ingestion-service:
    build:
      context: ./telemetry-ingestion-service
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SLOW_REQUEST_WARN_MS: ${SLOW_REQUEST_WARN_MS:-5000}
      INGESTION_MODE: ${INGESTION_MODE:-broker}
      BROKER_PROVIDER: ${BROKER_PROVIDER:-redis}
      BROKER_QUEUE_NAME: ${BROKER_QUEUE_NAME:-telemetry.ingestion}
      BROKER_CONSUMER_ENABLED: ${BROKER_CONSUMER_ENABLED_API:-false}
      BROKER_PREFETCH_COUNT: ${BROKER_PREFETCH_COUNT:-100}
      BROKER_BATCH_SIZE: ${BROKER_BATCH_SIZE:-100}
      BROKER_FLUSH_SECONDS: ${BROKER_FLUSH_SECONDS:-1.0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-telemetry-ingestion-group}
      REDIS_CONSUMER_NAME: ${REDIS_CONSUMER_NAME_API:-telemetry-ingestion-api}
      REDIS_POLL_TIMEOUT_MS: ${REDIS_POLL_TIMEOUT_MS:-1000}
      # RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2F}
      # RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-}
      # RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - vermicompost-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  telemetry-ingestion-worker:
    build:
      context: ./telemetry-ingestion-service
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SLOW_REQUEST_WARN_MS: ${SLOW_REQUEST_WARN_MS:-5000}
      INGESTION_MODE: ${INGESTION_MODE:-broker}
      BROKER_PROVIDER: ${BROKER_PROVIDER:-redis}
      BROKER_QUEUE_NAME: ${BROKER_QUEUE_NAME:-telemetry.ingestion}
      BROKER_CONSUMER_ENABLED: ${BROKER_CONSUMER_ENABLED_WORKER:-true}
      BROKER_PREFETCH_COUNT: ${BROKER_PREFETCH_COUNT:-100}
      BROKER_BATCH_SIZE: ${BROKER_BATCH_SIZE:-100}
      BROKER_FLUSH_SECONDS: ${BROKER_FLUSH_SECONDS:-1.0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-telemetry-ingestion-group}
      REDIS_CONSUMER_NAME: ${REDIS_CONSUMER_NAME_WORKER:-telemetry-ingestion-worker-{hostname}-{pid}}
      REDIS_POLL_TIMEOUT_MS: ${REDIS_POLL_TIMEOUT_MS:-1000}
    command: ["python", "-m", "app.worker"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vermicompost-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os; os.kill(1, 0)\" || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  query-monitoring-service:
    build:
      context: ./query-monitoring-service
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SLOW_REQUEST_WARN_MS: ${SLOW_REQUEST_WARN_MS:-5000}
      MONITORING_METRICS_REFRESH_SECONDS: ${MONITORING_METRICS_REFRESH_SECONDS:-30}
      MONITORING_DISCONNECT_MINUTES: ${MONITORING_DISCONNECT_MINUTES:-15}
    ports:
      - "8002:8000"
    networks:
      - vermicompost-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  digital-twin-integration-service:
    build:
      context: ./digital-twin-service
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SLOW_REQUEST_WARN_MS: ${SLOW_REQUEST_WARN_MS:-5000}
    ports:
      - "8003:8000"
    networks:
      - vermicompost-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - vermicompost-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ service temporarily disabled.
  # rabbitmq:
  #   image: rabbitmq:3.13-management-alpine
  #   profiles:
  #     - broker-rabbitmq
  #   environment:
  #     RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
  #     RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   networks:
  #     - vermicompost-net
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 5

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.wal-compression
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./monitoring/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro,Z
      - prometheus-data:/prometheus
    depends_on:
      telemetry-ingestion-service:
        condition: service_healthy
      query-monitoring-service:
        condition: service_healthy
      digital-twin-integration-service:
        condition: service_healthy
    ports:
      - "9090:9090"
    networks:
      - vermicompost-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build:
      context: ./api-gateway
    ports:
      - "8080:80"
    depends_on:
      telemetry-ingestion-service:
        condition: service_healthy
      query-monitoring-service:
        condition: service_healthy
      digital-twin-integration-service:
        condition: service_healthy
    networks:
      - vermicompost-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/telemetry/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  grafana-storage:
  prometheus-data:

networks:
  vermicompost-net:
    driver: bridge
