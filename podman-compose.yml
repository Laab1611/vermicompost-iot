services:

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana-enterprise
    restart: unless-stopped
    depends_on:
      - prometheus
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - grafana-storage:/var/lib/grafana:z
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:z
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:z
      - ./monitoring/grafana/provisioning/datasources/init-grafana-datasource.sh:/etc/grafana/provisioning/datasources/init-grafana-datasource.sh:z
    networks:
      - vermicompost-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      - telemetry-ingestion-service
      - query-monitoring-service
      - digital-twin-integration-service
      - node-exporter
      - postgres-exporter
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus:z
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:z
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.wal-compression"
    networks:
      - vermicompost-net

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - vermicompost-net
    pid: host
    ports:
      - "9100:9100"
    command:
      - --path.rootfs=/host
      - --collector.filesystem.ignored-mount-points='^/(sys|proc|dev|host|etc)($|/)'
      - --collector.netdev.device-whitelist=eth0
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL}
    ports:
      - "9187:9187"
    networks:
      - vermicompost-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9187/metrics || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  telemetry-ingestion-service:
    build:
      context: ./telemetry-ingestion-service
    env_file:
      - .env
    ports:
      - "8001:8000"
    networks:
      - vermicompost-net

  query-monitoring-service:
    build:
      context: ./query-monitoring-service
    env_file:
      - .env
    ports:
      - "8002:8000"
    networks:
      - vermicompost-net

  digital-twin-integration-service:
    build:
      context: ./digital-twin-service
    env_file:
      - .env
    ports:
      - "8003:8000"
    networks:
      - vermicompost-net

  nginx:
    build:
      context: ./api-gateway
    ports:
      - "8080:80"
    depends_on:
      - telemetry-ingestion-service
      - query-monitoring-service
      - digital-twin-integration-service
    networks:
      - vermicompost-net

volumes:
  grafana-storage:
  prometheus-data:

networks:
  vermicompost-net:
    driver: bridge
