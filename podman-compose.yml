x-disable-ipv6-sysctls: &disable-ipv6-sysctls
  net.ipv6.conf.all.disable_ipv6: "1"
  net.ipv6.conf.default.disable_ipv6: "1"

services:

  cert-provisioner:
    build:
      context: ./cert-provisioner
    restart: unless-stopped
    environment:
      CERT_SUBJECT_ALT_NAME: ${CERT_SUBJECT_ALT_NAME:-DNS:localhost,IP:127.0.0.1}
    volumes:
      - ./.certs:/certs:Z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /certs/localhost.crt && test -s /certs/localhost.key && openssl x509 -in /certs/localhost.crt -noout -subject -nameopt RFC2253 | grep -q 'O=UAO' && openssl x509 -in /certs/localhost.crt -noout -subject -nameopt RFC2253 | grep -q 'OU=BISITE Team EdgeAIoT'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana-enterprise
    restart: unless-stopped
    sysctls: *disable-ipv6-sysctls
    depends_on:
      cert-provisioner:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: ${GRAFANA_CSRF_TRUSTED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443}
      GF_SECURITY_CSRF_ADDITIONAL_HEADERS: X-Forwarded-Host
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://localhost:8443/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_METRICS_ENABLED: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    networks:
      - vermicompost-net
    healthcheck:
      start_period: 30s
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/grafana/api/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  telemetry-ingestion-service:
    build:
      context: ./telemetry-ingestion-service
    sysctls: *disable-ipv6-sysctls
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SLOW_REQUEST_WARN_MS: ${SLOW_REQUEST_WARN_MS:-5000}
      INGESTION_MODE: ${INGESTION_MODE:-broker}
      BROKER_PROVIDER: ${BROKER_PROVIDER:-redis}
      BROKER_QUEUE_NAME: ${BROKER_QUEUE_NAME:-telemetry.ingestion}
      BROKER_CONSUMER_ENABLED: ${BROKER_CONSUMER_ENABLED_API:-false}
      BROKER_PREFETCH_COUNT: ${BROKER_PREFETCH_COUNT:-100}
      BROKER_BATCH_SIZE: ${BROKER_BATCH_SIZE:-100}
      BROKER_FLUSH_SECONDS: ${BROKER_FLUSH_SECONDS:-1.0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-telemetry-ingestion-group}
      REDIS_CONSUMER_NAME: ${REDIS_CONSUMER_NAME_API:-telemetry-ingestion-api}
      REDIS_POLL_TIMEOUT_MS: ${REDIS_POLL_TIMEOUT_MS:-1000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vermicompost-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  telemetry-ingestion-worker:
    build:
      context: ./telemetry-ingestion-service
    sysctls: *disable-ipv6-sysctls
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SLOW_REQUEST_WARN_MS: ${SLOW_REQUEST_WARN_MS:-5000}
      INGESTION_MODE: ${INGESTION_MODE:-broker}
      BROKER_PROVIDER: ${BROKER_PROVIDER:-redis}
      BROKER_QUEUE_NAME: ${BROKER_QUEUE_NAME:-telemetry.ingestion}
      BROKER_CONSUMER_ENABLED: ${BROKER_CONSUMER_ENABLED_WORKER:-true}
      BROKER_PREFETCH_COUNT: ${BROKER_PREFETCH_COUNT:-100}
      BROKER_BATCH_SIZE: ${BROKER_BATCH_SIZE:-100}
      BROKER_FLUSH_SECONDS: ${BROKER_FLUSH_SECONDS:-1.0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-telemetry-ingestion-group}
      REDIS_CONSUMER_NAME: ${REDIS_CONSUMER_NAME_WORKER:-telemetry-ingestion-worker-{hostname}-{pid}}
      REDIS_POLL_TIMEOUT_MS: ${REDIS_POLL_TIMEOUT_MS:-1000}
    command: ["python", "-m", "app.worker"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vermicompost-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os; os.kill(1, 0)\" || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  query-monitoring-service:
    build:
      context: ./query-monitoring-service
    sysctls: *disable-ipv6-sysctls
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SLOW_REQUEST_WARN_MS: ${SLOW_REQUEST_WARN_MS:-5000}
      MONITORING_METRICS_REFRESH_SECONDS: ${MONITORING_METRICS_REFRESH_SECONDS:-30}
      MONITORING_DISCONNECT_MINUTES: ${MONITORING_DISCONNECT_MINUTES:-15}
    networks:
      - vermicompost-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  digital-twin-integration-service:
    build:
      context: ./digital-twin-service
    sysctls: *disable-ipv6-sysctls
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SLOW_REQUEST_WARN_MS: ${SLOW_REQUEST_WARN_MS:-5000}
    networks:
      - vermicompost-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    sysctls: *disable-ipv6-sysctls
    networks:
      - vermicompost-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ service temporarily disabled.
  # rabbitmq:
  #   image: rabbitmq:3.13-management-alpine
  #   profiles:
  #     - broker-rabbitmq
  #   environment:
  #     RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
  #     RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   networks:
  #     - vermicompost-net
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 5

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    sysctls: *disable-ipv6-sysctls
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.wal-compression
      - --web.route-prefix=/
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./monitoring/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro,Z
      - prometheus-data:/prometheus
    depends_on:
      cert-provisioner:
        condition: service_healthy
      telemetry-ingestion-service:
        condition: service_healthy
      query-monitoring-service:
        condition: service_healthy
      digital-twin-integration-service:
        condition: service_healthy
    networks:
      - vermicompost-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build:
      context: ./api-gateway
    sysctls: *disable-ipv6-sysctls
    ports:
      - "${NGINX_HTTPS_BIND:-127.0.0.1:8443}:443"
    volumes:
      - ./.certs:/etc/nginx/certs:ro,Z
    depends_on:
      telemetry-ingestion-service:
        condition: service_healthy
      query-monitoring-service:
        condition: service_healthy
      digital-twin-integration-service:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
    networks:
      - vermicompost-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --no-verbose --tries=1 --spider https://127.0.0.1/telemetry/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  grafana-storage:
  prometheus-data:

networks:
  vermicompost-net:
    driver: bridge
    enable_ipv6: false
